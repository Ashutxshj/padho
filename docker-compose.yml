version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookleaf-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=BookLeaf Author Support & Communication Portal
      - SECRET_KEY=bookleaf_secret_key_change_in_production_jwt_signing_token_123
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=sqlite+aiosqlite:///./bookleaf.db
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - AI_PROVIDER=mock
    volumes:
      - ./backend/bookleaf.db:/app/bookleaf.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookleaf-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
